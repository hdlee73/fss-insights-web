<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>금융사 리스크 대시보드 시뮬레이션</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../../css/app.css">
  <style>
    body { display: block; height: auto; }
    .rk-shell { max-width: 1040px; margin: 0 auto; padding: 0 16px 40px; }
    .rk-top { position: sticky; top: 0; z-index: 5; background: var(--top); border-bottom: 1px solid var(--line); margin: 0 -16px 14px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
    .rk-top h1 { font-size: 17px; margin: 0; } .rk-top .sub { font-size: 12px; color: var(--muted); }
    #rk-acts { margin-left: auto; display: flex; gap: 6px; }
  </style>
</head>
<body>
  <div class="rk-shell">
    <header class="rk-top"><div><h1 id="rk-title">금융사 리스크 대시보드</h1><div id="rk-sub" class="sub"></div></div><div id="rk-acts"></div></header>
    <div id="rk-root"></div>
  </div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
